<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        :root {
            --bg: #191919;
            --text: #e9e9e7;
            --muted: #8b8b8b;
            --accent: #5b8def;
            --divider: #2f2f2f;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        }
        /* Notion-style: the toolbar stays out of the way (barely visible) until
           the mouse is over it, and the writing area is a borderless canvas. */
        #toolbar {
            position: sticky; top: 0; z-index: 5;
            display: flex; flex-wrap: wrap; gap: 6px;
            padding: 8px 12px; background: var(--bg);
            opacity: 0.25; transition: opacity 0.15s ease;
        }
        #toolbar:hover, #toolbar:focus-within { opacity: 1; }
        #toolbar button {
            background: transparent; color: var(--text);
            border: 1px solid var(--divider); border-radius: 6px;
            padding: 5px 10px; font-size: 13px; cursor: pointer;
        }
        #toolbar button:hover { background: var(--divider); }
        #editor {
            max-width: 760px; margin: 0 auto;      /* centered column, like Notion */
            padding: 14px 24px 40vh;                /* big bottom pad: click anywhere, keep writing */
            min-height: 240px; outline: none;
            font-size: 15px; line-height: 1.6;
        }
        #editor:empty::before {
            content: attr(data-placeholder); color: var(--muted);
        }
        #editor h1 { font-size: 26px; margin: 0.4em 0; }
        #editor h2 { font-size: 20px; margin: 0.4em 0; }
        #editor table {
            border-collapse: collapse; margin: 10px 0; width: auto;
        }
        #editor th, #editor td {
            border: 1px solid var(--divider); padding: 6px 10px; min-width: 60px;
        }
        #editor th { background: rgba(128,128,128,0.15); font-weight: 600; }
        .ghost { color: var(--muted); opacity: 0.75; }

        /* ---- Notion-style block handle + context menu ---- */
        /* ⋮⋮ grip that appears in the left gutter of the hovered block. */
        #handle {
            position: fixed; display: none; width: 22px; height: 24px;
            align-items: center; justify-content: center;
            color: var(--muted); border-radius: 5px; cursor: pointer;
            font-size: 14px; letter-spacing: -1px; user-select: none; z-index: 9;
        }
        #handle:hover { background: var(--divider); color: var(--text); }
        #blockmenu {
            position: fixed; display: none; width: 250px;
            background: var(--bg); border: 1px solid var(--divider);
            border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,0.5);
            padding: 6px; z-index: 10; font-size: 13.5px;
        }
        .bm-input {
            width: 100%; margin: 2px 2px 6px; padding: 6px 8px;
            background: transparent; color: var(--text);
            border: 1px solid var(--divider); border-radius: 6px;
            font-size: 13px; outline: none;
        }
        .bm-input:focus { border-color: var(--accent); }
        .bm-item {
            display: flex; gap: 9px; align-items: center;
            padding: 6px 8px; border-radius: 6px; cursor: pointer;
            color: var(--text); white-space: nowrap;
        }
        .bm-item:hover, .bm-item.active { background: var(--divider); }
        .bm-icon { width: 18px; text-align: center; color: var(--muted); flex: none; }
        .bm-kbd { margin-left: auto; color: var(--muted); font-size: 11px; }
        .bm-chev { margin-left: auto; color: var(--muted); }
        .bm-sep { height: 1px; background: var(--divider); margin: 5px 4px; }
        .bm-title { padding: 4px 8px 6px; color: var(--muted); font-size: 11px; }
        .bm-danger, .bm-danger .bm-icon { color: #e35958; }
        .bm-swatches { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; padding: 4px 6px 8px; }
        .bm-swatch {
            width: 20px; height: 20px; border-radius: 5px;
            border: 1px solid var(--divider); cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 11px;
        }
        .bm-swatch:hover { outline: 2px solid var(--accent); }
        /* Block being rewritten by AI pulses until the result lands. */
        .ai-busy { animation: aibusy 1.1s ease-in-out infinite; }
        @keyframes aibusy { 50% { opacity: 0.4; } }

        /* ---- Rich blocks ---- */
        #editor blockquote {
            margin: 8px 0; padding: 2px 14px;
            border-left: 3px solid var(--text);
        }
        #editor pre {
            background: rgba(128,128,128,0.12);
            border-radius: 6px; padding: 12px 14px; margin: 8px 0;
            font-family: ui-monospace, "SF Mono", Consolas, monospace;
            font-size: 13.5px; white-space: pre-wrap;
        }
        #editor hr {
            border: none; border-top: 1px solid var(--divider); margin: 14px 0;
        }
        #editor .callout {
            display: flex; gap: 10px; align-items: flex-start;
            background: rgba(128,128,128,0.12); border-radius: 8px;
            padding: 12px 14px; margin: 8px 0;
        }
        #editor .callout-icon { user-select: none; }
        #editor .callout-body { flex: 1; min-width: 0; }
        #editor .todo {
            display: flex; gap: 8px; align-items: baseline; margin: 2px 0;
        }
        #editor .todo input[type="checkbox"] {
            width: 15px; height: 15px; accent-color: var(--accent);
            cursor: pointer; flex-shrink: 0; transform: translateY(2px);
        }
        #editor .todo.done span { text-decoration: line-through; color: var(--muted); }
        #editor details { margin: 4px 0; padding-left: 2px; }
        #editor summary { cursor: default; list-style: none; font-weight: 600; }
        #editor summary::-webkit-details-marker { display: none; }
        #editor summary::before {
            content: '▸'; display: inline-block; width: 18px; cursor: pointer;
            color: var(--muted); transition: transform 0.1s ease;
        }
        #editor details[open] > summary::before { transform: rotate(90deg); }
        #editor details > div { padding-left: 18px; }

        /* ---- Column layouts ---- */
        #editor .cols { display: flex; gap: 20px; margin: 8px 0; }
        #editor .col { flex: 1; min-width: 0; }
        #editor .cols .col + .col { border-left: 1px solid var(--divider); padding-left: 20px; }

        /* ---- Drag-to-reorder drop indicator ---- */
        #dropline {
            position: fixed; z-index: 8; display: none; height: 2px;
            background: var(--accent); border-radius: 1px; pointer-events: none;
        }

        /* ---- Slash-command menu ---- */
        #slashmenu {
            position: fixed; z-index: 30; display: none;
            min-width: 210px; max-height: 320px; overflow-y: auto;
            background: var(--bg); border: 1px solid var(--divider);
            border-radius: 10px; padding: 6px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.45);
        }
        #slashmenu button {
            display: block; width: 100%; text-align: left;
            background: transparent; border: none; color: var(--text);
            padding: 7px 10px; font-size: 13.5px; border-radius: 6px; cursor: pointer;
        }
        #slashmenu button.sel { background: var(--divider); }
        #slashmenu .hint { color: var(--muted); font-size: 11px; padding: 4px 10px; }

        /* ---- Floating selection toolbar ---- */
        #selbar {
            position: fixed; z-index: 30; display: none;
            background: var(--bg); border: 1px solid var(--divider);
            border-radius: 10px; padding: 5px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.45);
            white-space: nowrap;
        }
        #selbar button {
            background: transparent; border: none; color: var(--text);
            padding: 5px 9px; font-size: 14px; border-radius: 6px; cursor: pointer;
        }
        #selbar button:hover { background: var(--divider); }
        #selpalette { display: none; padding: 8px 6px 4px; }
        #selpalette .row { display: flex; gap: 5px; align-items: center; margin-bottom: 6px; }
        #selpalette .lbl { color: var(--muted); font-size: 10.5px; width: 52px; }
        #selpalette .sw {
            width: 20px; height: 20px; border-radius: 5px; cursor: pointer;
            border: 1px solid var(--divider); padding: 0; font-size: 11px;
            display: inline-flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button onclick="fmt('bold')"><b>B</b></button>
        <button onclick="block('H1')">H1</button>
        <button onclick="block('H2')">H2</button>
        <button onclick="fmt('insertUnorderedList')">• List</button>
        <button onclick="insertTable()">Table</button>
        <button onclick="addRow()">+ Row</button>
        <button onclick="addCol()">+ Col</button>
    </div>
    <div id="editor" contenteditable="true" data-placeholder="Type '/' for blocks, select text to format, Tab accepts AI suggestions..."></div>

    <!-- Block handle (⋮⋮) and the Notion-style block context menu. They live
         outside the contenteditable so interacting with them never edits text.
         Press-and-drag the handle to move the block; a plain click opens the menu. -->
    <div id="handle" title="Drag to move, click for actions">⋮⋮</div>
    <div id="blockmenu"></div>
    <div id="dropline"></div>

    <!-- Slash-command menu (shown when '/' is typed) -->
    <div id="slashmenu"></div>

    <!-- Floating toolbar (shown over selected text) -->
    <div id="selbar">
        <button data-cmd="bold" title="Bold"><b>B</b></button><button data-cmd="italic" title="Italic"><i>I</i></button><button data-cmd="underline" title="Underline"><u>U</u></button><button data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button><button id="palToggle" title="Colors">A<span style="color:var(--accent)">▾</span></button>
        <div id="selpalette">
            <div class="row"><span class="lbl">Text</span></div>
            <div class="row"><span class="lbl">Highlight</span></div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        let ghostEl = null;      // the currently-shown ghost <span>, if any
        let ghostId = 0;         // id of the latest completion request
        let idleTimer = null;    // debounce for triggering completion
        let changeTimer = null;  // debounce for notifying C# of edits

        // ---- Bridge helpers ----
        // The HybridWebView message bridge (window.HybridWebView) doesn't get
        // injected reliably here, but EvaluateJavaScriptAsync works. So JS queues
        // outbound messages and C# polls window.__drain(); C# pushes inbound
        // messages via window.__inbox(). Payloads are base64 so quotes/newlines
        // can't be mangled by the JS-evaluation layer.
        window.__outbox = [];
        function send(obj) { window.__outbox.push(obj); }

        function utf8ToB64(s) { return btoa(unescape(encodeURIComponent(s))); }
        function b64ToUtf8(b) { return decodeURIComponent(escape(atob(b))); }

        // C# calls this repeatedly to collect queued messages (base64 JSON, or '').
        window.__drain = function () {
            if (window.__outbox.length === 0) return '';
            const s = JSON.stringify(window.__outbox);
            window.__outbox = [];
            return utf8ToB64(s);
        };

        // C# calls this to deliver a message to the editor.
        window.__inbox = function (b64) {
            let msg;
            try { msg = JSON.parse(b64ToUtf8(b64)); } catch (e) { return; }
            if (msg.action === 'load') { epoch = msg.epoch || 0; window.loadContent(msg.html, !!msg.keepHistory); }
            else if (msg.action === 'theme') window.setTheme(msg.theme);
            else if (msg.action === 'complete') window.applyCompletion(msg.id, msg.text);
            // Block-scoped AI result; only applies if we're still on the same note.
            else if (msg.action === 'blockAiResult') {
                if ((msg.epoch || 0) === epoch) window.applyBlockAi(msg.id, msg.html, msg.error);
                else finishBlockAi(msg.id);
            }
        };

        // C# calls this right before saving: cancel any pending debounced change
        // notification and hand back the current content directly, so a save can
        // never miss the last few keystrokes. JSON-wrapped so empty content is
        // still distinguishable from "no reply".
        window.__flush = function () {
            clearTimeout(changeTimer);
            return utf8ToB64(JSON.stringify({ html: getContent() }));
        };

        // Note bodies are HTML synced from the server, so treat them as untrusted:
        // strip anything executable (scripts, embeds, inline handlers, js: URLs)
        // before it ever reaches editor.innerHTML.
        function sanitize(html) {
            const doc = new DOMParser().parseFromString(html || '', 'text/html');
            doc.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(n => n.remove());
            for (const el of doc.body.querySelectorAll('*')) {
                for (const attr of [...el.attributes]) {
                    const name = attr.name.toLowerCase();
                    const value = attr.value.trim().toLowerCase();
                    if (name.startsWith('on') ||
                        ((name === 'href' || name === 'src') && value.startsWith('javascript:'))) {
                        el.removeAttribute(attr.name);
                    }
                }
            }
            return doc.body.innerHTML;
        }

        // Return the editor HTML with any ghost text stripped out. The ai-busy
        // pending marker is presentation-only state — strip it too, or a save
        // that fires mid-request would persist a forever-pulsing block.
        function getContent() {
            const clone = editor.cloneNode(true);
            clone.querySelectorAll('.ghost').forEach(g => g.remove());
            clone.querySelectorAll('.ai-busy').forEach(el => {
                el.classList.remove('ai-busy');
                if (!el.getAttribute('class')) el.removeAttribute('class');
            });
            return clone.innerHTML;
        }

        // Plain text (no ghost) for AI context.
        function getText() {
            removeGhost();
            return editor.innerText;
        }

        // ---- Called from C# ----
        window.loadContent = function (html, keepHistory) {
            // New content is being loaded: any pending or queued 'changed'
            // notification describes the PREVIOUS content. Drop them, or stale
            // content could overwrite what we're about to show.
            clearTimeout(changeTimer);
            clearTimeout(idleTimer);
            window.__outbox = window.__outbox.filter(m => m.type !== 'changed');
            removeGhost();
            // A different (or reloaded) note invalidates the block menu, the
            // slash menu, and any in-flight block AI request on the old DOM.
            closeMenu();
            closeSlash();
            for (const k of Object.keys(pendingAiBlocks)) finishBlockAi(k);
            if (keepHistory) {
                // Same note, new content (an AI edit): commit the pre-edit state
                // first so a single undo restores it.
                pushHistory();
                editor.innerHTML = sanitize(html);
                pushHistory();
            } else {
                // Different note: undo must never cross into another note.
                editor.innerHTML = sanitize(html);
                resetHistory();
            }
        };
        window.setTheme = function (t) {
            const r = document.documentElement.style;
            r.setProperty('--bg', t.bg);
            r.setProperty('--text', t.text);
            r.setProperty('--muted', t.muted);
            r.setProperty('--accent', t.accent);
            r.setProperty('--divider', t.divider);
            // Rebuild the highlight palette to match the theme's brightness.
            themeIsDark = t.dark !== false;
            buildPalette();
        };
        window.applyCompletion = function (id, text) {
            if (id !== ghostId || !text || !caretAtEnd()) return;
            removeGhost();
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const range = sel.getRangeAt(0).cloneRange();
            ghostEl = document.createElement('span');
            ghostEl.className = 'ghost';
            ghostEl.contentEditable = 'false';
            ghostEl.textContent = text;
            // Insert inline exactly at the caret so the suggestion flows with the text.
            range.insertNode(ghostEl);
            // Keep the caret right before the ghost so typing continues in place.
            const caret = document.createRange();
            caret.setStartBefore(ghostEl);
            caret.collapse(true);
            sel.removeAllRanges();
            sel.addRange(caret);
        };

        // ---- Ghost text lifecycle ----
        function removeGhost() {
            if (ghostEl && ghostEl.parentNode) ghostEl.parentNode.removeChild(ghostEl);
            ghostEl = null;
        }
        function acceptGhost() {
            if (!ghostEl) return;
            // Replace the ghost span with a real text node in place.
            const textNode = document.createTextNode(ghostEl.textContent);
            ghostEl.parentNode.replaceChild(textNode, ghostEl);
            ghostEl = null;
            // Put the caret at the end of the just-accepted text.
            const sel = window.getSelection();
            const caret = document.createRange();
            caret.setStartAfter(textNode);
            caret.collapse(true);
            sel.removeAllRanges();
            sel.addRange(caret);
            notifyChanged();
        }
        function caretAtEnd() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return false;
            const range = sel.getRangeAt(0);
            if (!range.collapsed) return false;
            // True if nothing (other than the ghost) follows the caret.
            const after = range.cloneRange();
            after.selectNodeContents(editor);
            after.setStart(range.endContainer, range.endOffset);
            const rest = after.cloneContents();
            rest.querySelectorAll && rest.querySelectorAll('.ghost').forEach(g => g.remove());
            return (rest.textContent || '').trim().length === 0;
        }
        function scheduleCompletion() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                if (!caretAtEnd()) return;
                const text = editor.innerText.slice(-600).trim();
                if (text.length < 3) return;
                ghostId++;
                send({ type: 'complete', id: ghostId, context: text });
            }, 700);
        }

        // ---- Change notification (debounced) ----
        // Each loadContent stamps a new epoch; echoing it lets C# discard any
        // 'changed' message that describes a previously-loaded note.
        let epoch = 0;
        function notifyChanged() {
            clearTimeout(changeTimer);
            changeTimer = setTimeout(() => send({ type: 'changed', html: getContent(), epoch: epoch }), 250);
            scheduleHistory();
        }

        // ---- Undo / redo ----
        // WebKit's native contenteditable undo is unreliable here: loading notes
        // via innerHTML resets its history and programmatic edits (ghost text,
        // toolbar commands) pollute it. So the editor keeps its own snapshot
        // history and handles the standard shortcuts itself.
        let hist = [''];         // snapshots of editor content
        let hIndex = 0;          // current position in hist
        let histTimer = null;    // debounce so rapid typing = one undo step

        function scheduleHistory() {
            clearTimeout(histTimer);
            histTimer = setTimeout(pushHistory, 350);
        }
        function pushHistory() {
            clearTimeout(histTimer);
            const s = getContent();
            if (hist[hIndex] === s) return;   // nothing actually changed
            hist = hist.slice(0, hIndex + 1); // drop any redo branch
            hist.push(s);
            if (hist.length > 200) hist.shift();
            hIndex = hist.length - 1;
        }
        function resetHistory() {
            clearTimeout(histTimer);
            hist = [getContent()];
            hIndex = 0;
        }
        function restore(html) {
            removeGhost();
            editor.innerHTML = html;
            placeCaretAtEnd();
            notifyChanged();  // sync C#; dedupe in pushHistory keeps hist clean
        }
        function undo() {
            pushHistory();    // commit any pending keystrokes first
            if (hIndex > 0) { hIndex--; restore(hist[hIndex]); }
        }
        function redo() {
            if (hIndex < hist.length - 1) { hIndex++; restore(hist[hIndex]); }
        }
        function placeCaretAtEnd() { placeCaretAtEndOf(editor); }

        // ---- Toolbar actions ----
        function fmt(cmd) { editor.focus(); document.execCommand(cmd, false, null); notifyChanged(); }
        function block(tag) { editor.focus(); document.execCommand('formatBlock', false, tag); notifyChanged(); }
        function insertTable() {
            editor.focus();
            const html = '<table><tr><th>Column 1</th><th>Column 2</th></tr>' +
                         '<tr><td>&nbsp;</td><td>&nbsp;</td></tr></table><p>&nbsp;</p>';
            document.execCommand('insertHTML', false, html);
            notifyChanged();
        }
        function currentTable() {
            let n = window.getSelection().anchorNode;
            while (n && n !== editor) {
                if (n.tagName === 'TABLE') return n;
                n = n.parentNode;
            }
            const tables = editor.querySelectorAll('table');
            return tables.length ? tables[tables.length - 1] : null;
        }
        function addRow() {
            const t = currentTable(); if (!t) return;
            const cols = t.rows[0] ? t.rows[0].cells.length : 2;
            const row = t.insertRow(-1);
            for (let i = 0; i < cols; i++) { row.insertCell(-1).innerHTML = '&nbsp;'; }
            notifyChanged();
        }
        function addCol() {
            const t = currentTable(); if (!t) return;
            for (let i = 0; i < t.rows.length; i++) {
                const cell = t.rows[i].insertCell(-1);
                cell.innerHTML = i === 0 ? '<b>&nbsp;</b>' : '&nbsp;';
            }
            notifyChanged();
        }

        // ---- Rich block insertion (used by the slash menu) ----
        function insertBlockHtml(html) {
            editor.focus();
            document.execCommand('insertHTML', false, html);
            notifyChanged();
        }
        function insertTodo() {
            insertBlockHtml('<div class="todo"><input type="checkbox" contenteditable="false"><span>&nbsp;</span></div>');
        }
        function insertToggle() {
            insertBlockHtml('<details open><summary>Toggle</summary><div>&nbsp;</div></details><p>&nbsp;</p>');
        }
        function insertCallout() {
            insertBlockHtml('<div class="callout"><span class="callout-icon" contenteditable="false">💡</span><div class="callout-body">&nbsp;</div></div><p>&nbsp;</p>');
        }
        function insertDivider() {
            insertBlockHtml('<hr contenteditable="false"><p>&nbsp;</p>');
        }
        function insertColumns(count) {
            let cols = '';
            for (let i = 0; i < count; i++) {
                cols += '<div class="col"><p>&nbsp;</p></div>';
            }
            insertBlockHtml('<div class="cols">' + cols + '</div><p>&nbsp;</p>');
        }

        // ---- Slash-command menu ----
        const slashMenu = document.getElementById('slashmenu');
        let slashActive = false;
        let slashAnchor = null;   // {node, offset} right AFTER the typed '/'
        let slashIndex = 0;
        let slashFiltered = [];

        const slashItems = [
            { t: 'Text',          k: 'text paragraph plain', run: () => block('P') },
            { t: 'Heading 1',     k: 'h1 heading big',       run: () => block('H1') },
            { t: 'Heading 2',     k: 'h2 heading',           run: () => block('H2') },
            { t: 'Heading 3',     k: 'h3 heading small',     run: () => block('H3') },
            { t: 'Bulleted list', k: 'bullet ul list',       run: () => fmt('insertUnorderedList') },
            { t: 'Numbered list', k: 'number ol list',       run: () => fmt('insertOrderedList') },
            { t: 'To-do list',    k: 'todo check task',      run: insertTodo },
            { t: 'Toggle list',   k: 'toggle collapse',      run: insertToggle },
            { t: 'Code',          k: 'code snippet',         run: () => block('PRE') },
            { t: 'Quote',         k: 'quote blockquote',     run: () => block('BLOCKQUOTE') },
            { t: 'Callout',       k: 'callout info box',     run: insertCallout },
            { t: 'Divider',       k: 'divider hr line',      run: insertDivider },
            { t: 'Table',         k: 'table grid',           run: insertTable },
            { t: '2 columns',     k: 'columns two layout',   run: () => insertColumns(2) },
            { t: '3 columns',     k: 'columns three layout', run: () => insertColumns(3) },
        ];

        function openSlash() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const r = sel.getRangeAt(0);
            slashAnchor = { node: r.startContainer, offset: r.startOffset };
            slashActive = true;
            slashIndex = 0;
            renderSlash('');
            const rect = r.getBoundingClientRect();
            slashMenu.style.left = Math.min(rect.left, window.innerWidth - 230) + 'px';
            slashMenu.style.top = Math.min(rect.bottom + 6, window.innerHeight - 330) + 'px';
            slashMenu.style.display = 'block';
        }
        function closeSlash() {
            slashActive = false;
            slashAnchor = null;
            slashMenu.style.display = 'none';
        }
        function slashQuery() {
            const sel = window.getSelection();
            if (!sel.rangeCount || !slashAnchor) return null;
            try {
                const r = document.createRange();
                r.setStart(slashAnchor.node, slashAnchor.offset);
                r.setEnd(sel.anchorNode, sel.anchorOffset);
                return r.toString();
            } catch (e) { return null; }
        }
        function renderSlash(q) {
            q = (q || '').toLowerCase().trim();
            slashFiltered = slashItems.filter(i =>
                !q || i.t.toLowerCase().includes(q) || i.k.includes(q));
            if (slashFiltered.length === 0) { closeSlash(); return; }
            if (slashIndex >= slashFiltered.length) slashIndex = 0;
            slashMenu.innerHTML = '<div class="hint">Blocks</div>';
            slashFiltered.forEach((item, i) => {
                const b = document.createElement('button');
                b.textContent = item.t;
                if (i === slashIndex) b.className = 'sel';
                // mousedown (not click) so the editor selection isn't lost first
                b.addEventListener('mousedown', (e) => { e.preventDefault(); applySlash(item); });
                slashMenu.appendChild(b);
            });
        }
        function applySlash(item) {
            // Remove the typed '/query' text, then run the block action.
            const sel = window.getSelection();
            if (slashAnchor && sel.rangeCount) {
                try {
                    const r = document.createRange();
                    r.setStart(slashAnchor.node, slashAnchor.offset - 1); // include the '/'
                    r.setEnd(sel.anchorNode, sel.anchorOffset);
                    r.deleteContents();
                } catch (e) { /* text mutated under us - just run the action */ }
            }
            closeSlash();
            item.run();
            pushHistory();
        }
        // Open when '/' is typed at a word boundary; keep filtering while it's open.
        function checkSlashTrigger() {
            if (slashActive) {
                const q = slashQuery();
                if (q === null || q.includes('\n') || q.length > 24) { closeSlash(); return; }
                renderSlash(q);
                return;
            }
            const sel = window.getSelection();
            if (!sel.rangeCount || !sel.isCollapsed) return;
            const n = sel.anchorNode;
            if (n.nodeType !== 3) return;
            const off = sel.anchorOffset;
            if (off < 1 || n.textContent[off - 1] !== '/') return;
            if (off >= 2 && !/\s/.test(n.textContent[off - 2])) return; // mid-word '/', e.g. URLs
            openSlash();
        }

        // ---- Floating selection toolbar ----
        const selBar = document.getElementById('selbar');
        const selPalette = document.getElementById('selpalette');
        let selBarTimer = null;

        // Text colors work on both light and dark backgrounds; highlight
        // backgrounds swap with the theme (deep tints on dark, pastels on light).
        const selTextColors = ['default', '#9B9B9B', '#BA856F', '#D9730D', '#CB912F', '#448361', '#337EA9', '#9065B0', '#C14C8A', '#D44C47'];
        const selHighlightsDark = ['default', '#454B4E', '#59563B', '#594A3A', '#354C4B', '#364954', '#443F57', '#533B4C', '#594141'];
        const selHighlightsLight = ['default', '#E9E9E7', '#FBF3DB', '#FAEBDD', '#EDF3EC', '#E7F3F8', '#F6F3F9', '#FAF1F5', '#FDEBEC'];
        let themeIsDark = true;

        function buildPalette() {
            const rows = selPalette.querySelectorAll('.row');
            rows[0].querySelectorAll('.sw').forEach(s => s.remove());
            rows[1].querySelectorAll('.sw').forEach(s => s.remove());
            selTextColors.forEach(c => rows[0].appendChild(makeSwatch(c, false)));
            (themeIsDark ? selHighlightsDark : selHighlightsLight).forEach(c => rows[1].appendChild(makeSwatch(c, true)));
        }
        function makeSwatch(c, isBg) {
            const b = document.createElement('button');
            b.className = 'sw';
            if (c === 'default') { b.textContent = '✕'; b.style.color = 'var(--muted)'; }
            else if (isBg) { b.style.background = c; }
            else { b.style.color = c; b.textContent = 'A'; }
            b.addEventListener('mousedown', (e) => { e.preventDefault(); applySelColor(c, isBg); });
            return b;
        }
        function applySelColor(c, isBg) {
            document.execCommand('styleWithCSS', false, true);
            if (c === 'default') {
                if (isBg) { document.execCommand('hiliteColor', false, 'transparent'); }
                else { document.execCommand('foreColor', false, getComputedStyle(editor).color); }
            } else {
                document.execCommand(isBg ? 'hiliteColor' : 'foreColor', false, c);
            }
            document.execCommand('styleWithCSS', false, false);
            notifyChanged();
        }
        function updateSelBar() {
            const sel = window.getSelection();
            if (!sel.rangeCount || sel.isCollapsed || !editor.contains(sel.anchorNode)) {
                selBar.style.display = 'none';
                selPalette.style.display = 'none';
                return;
            }
            const rect = sel.getRangeAt(0).getBoundingClientRect();
            selBar.style.display = 'block';
            const w = selBar.offsetWidth;
            selBar.style.left = Math.max(8, Math.min(rect.left + rect.width / 2 - w / 2, window.innerWidth - w - 8)) + 'px';
            selBar.style.top = Math.max(8, rect.top - selBar.offsetHeight - 8) + 'px';
        }
        document.addEventListener('selectionchange', () => {
            clearTimeout(selBarTimer);
            selBarTimer = setTimeout(updateSelBar, 120);
        });
        selBar.querySelectorAll('button[data-cmd]').forEach(b =>
            b.addEventListener('mousedown', (e) => { e.preventDefault(); fmt(b.dataset.cmd); }));
        document.getElementById('palToggle').addEventListener('mousedown', (e) => {
            e.preventDefault();
            selPalette.style.display = selPalette.style.display === 'block' ? 'none' : 'block';
        });
        buildPalette();

        // ---- Notion-style block menu ----------------------------------------
        // A "block" is a direct child of #editor, except inside lists where each
        // <li> is its own block (like Notion bullets). The ⋮⋮ handle appears in
        // the gutter of the hovered block; clicking it (or right-clicking the
        // block) opens the action menu.
        const handle = document.getElementById('handle');
        const menu = document.getElementById('blockmenu');
        let menuBlock = null;        // block the open menu is acting on
        let hoverBlock = null;       // block currently showing the handle
        let aiBlockSeq = 0;
        const pendingAiBlocks = {};  // request id -> block awaiting an AI result

        function menuOpen() { return menu.style.display === 'block'; }

        // Tags the menu can act on. Bare text nodes, <br>s, and inline elements
        // at the editor root (plain-text notes render as 'line<br>line'; the
        // first line typed into an empty note is a bare text node) are NOT
        // blocks — treating them as blocks made Delete/Duplicate act on a <br>
        // and merge unrelated lines. They become blocks via normalizeEditorBlocks.
        const BLOCK_TAGS = new Set(['DIV', 'P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6',
                                    'UL', 'OL', 'LI', 'TABLE', 'BLOCKQUOTE', 'PRE', 'DETAILS']);

        // The block containing a DOM node (innermost li wins), or null.
        function blockOf(node) {
            let el = node && (node.nodeType === 1 ? node : node.parentElement);
            if (!el || !editor.contains(el) || el === editor) return null;
            let cur = el, li = null;
            while (cur && cur.parentElement !== editor) {
                if (!li && cur.tagName === 'LI') li = cur;
                cur = cur.parentElement;
            }
            if (!cur || (cur.classList && cur.classList.contains('ghost'))) return null;
            const found = li || cur;
            return BLOCK_TAGS.has(found.tagName) ? found : null;
        }

        // The block nearest to a viewport Y (for gutter hover, where the pointer
        // isn't over the text itself).
        function blockAtY(y) {
            let best = null, bestDist = Infinity;
            for (const top of editor.children) {
                if (!BLOCK_TAGS.has(top.tagName)) continue;
                const units = (top.tagName === 'UL' || top.tagName === 'OL') ? [...top.children] : [top];
                for (const u of units) {
                    const r = u.getBoundingClientRect();
                    if (y >= r.top && y <= r.bottom) return u;
                    const d = y < r.top ? r.top - y : y - r.bottom;
                    if (d < bestDist) { bestDist = d; best = u; }
                }
            }
            return bestDist <= 28 ? best : null;
        }

        // Wraps bare text/inline runs at the editor root into <div> blocks
        // (dropping the <br> separators — div boundaries replace them), so the
        // block menu can work on plain-text-origin notes. Runs on demand from
        // the context menu, never on load or hover, so it can't disturb typing.
        function normalizeEditorBlocks() {
            let changed = false;
            let run = [];
            const flush = (before) => {
                if (run.length === 0) return;
                const div = document.createElement('div');
                editor.insertBefore(div, before);
                run.forEach(n => div.appendChild(n));
                run = [];
                changed = true;
            };
            for (const n of [...editor.childNodes]) {
                const isBlock = n.nodeType === 1 && BLOCK_TAGS.has(n.tagName);
                const isBr = n.nodeType === 1 && n.tagName === 'BR';
                if (isBlock) { flush(n); }
                else if (isBr) { flush(n); n.remove(); changed = true; }
                else if (n.nodeType === 3 && !n.textContent.trim()) { /* skip whitespace */ }
                else { run.push(n); }
            }
            flush(null);
            if (changed) { notifyChanged(); pushHistory(); }
            return changed;
        }

        // ---- Block operations (each commits an undo step + notifies C#) ----
        function afterBlockEdit() { notifyChanged(); pushHistory(); }

        // Single selection-to-range idiom for the whole editor: select an
        // element's contents, optionally collapsed to a caret at its end.
        function selectContents(el, collapseToEnd) {
            editor.focus();
            const sel = window.getSelection();
            const range = document.createRange();
            range.selectNodeContents(el);
            if (collapseToEnd) range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
        }
        function setSelectionToBlock(b) { selectContents(b, false); }
        function placeCaretAtEndOf(el) { selectContents(el, true); }

        // A block's content without UI artifacts (ghosts, checkboxes, callout
        // icons), for conversions that rebuild the block around its text.
        function blockInner(b) {
            const clone = b.cloneNode(true);
            clone.querySelectorAll('.ghost, input[type="checkbox"], .callout-icon').forEach(n => n.remove());
            const html = (clone.tagName === 'DETAILS')
                ? [...clone.children].map(c => c.innerHTML).join(' ')
                : clone.innerHTML;
            return (html || '').trim() || '&nbsp;';
        }

        // Converts a block into one of the rich kinds (to-do/toggle/callout),
        // preserving its content. List items are lifted out beside their list.
        function convertSpecial(b, kind) {
            const inner = blockInner(b);
            const html = kind === 'TODO'
                ? '<div class="todo"><input type="checkbox" contenteditable="false"><span>' + inner + '</span></div>'
                : kind === 'TOGGLE'
                ? '<details open><summary>' + inner + '</summary><div><br></div></details>'
                : '<div class="callout"><span class="callout-icon" contenteditable="false">💡</span><div class="callout-body"><div>' + inner + '</div></div></div>';
            const t = document.createElement('template');
            t.innerHTML = html;
            const el = t.content.firstElementChild;
            if (b.tagName === 'LI') {
                const list = b.parentElement;
                list.after(el);
                b.remove();
                if (list && !list.children.length) list.remove();
            } else {
                b.replaceWith(el);
            }
            placeCaretAtEndOf(el.querySelector('span, .callout-body div, summary') || el);
        }

        function turnInto(b, kind) {
            if (b.tagName === 'TABLE') return;
            removeGhost();

            if (kind === 'TODO' || kind === 'TOGGLE' || kind === 'CALLOUT') {
                convertSpecial(b, kind);
                afterBlockEdit();
                return;
            }

            // Rich source blocks (todo/callout/toggle) are first simplified to a
            // plain div so formatBlock/list commands don't wrap their chrome.
            if ((b.matches && b.matches('.todo, .callout')) || b.tagName === 'DETAILS') {
                const div = document.createElement('div');
                div.innerHTML = blockInner(b);
                b.replaceWith(div);
                b = div;
            }

            setSelectionToBlock(b);
            // A list item is lifted out with the command matching its OWN list
            // type — running insertUnorderedList on an <ol> item would convert
            // the list instead of unlisting the item.
            const liftCmd = b.tagName === 'LI' && b.parentElement && b.parentElement.tagName === 'OL'
                ? 'insertOrderedList' : 'insertUnorderedList';
            if (kind === 'UL' || kind === 'OL') {
                const wantCmd = kind === 'UL' ? 'insertUnorderedList' : 'insertOrderedList';
                if (b.tagName === 'LI') {
                    if (liftCmd === wantCmd) return; // already that list type
                    document.execCommand(liftCmd);   // out of its current list...
                    document.execCommand(wantCmd);   // ...and into the other kind
                } else {
                    document.execCommand(wantCmd);
                }
            } else {
                if (b.tagName === 'LI') document.execCommand(liftCmd);
                document.execCommand('formatBlock', false, kind);
            }
            afterBlockEdit();
        }

        function duplicateBlock(b) {
            removeGhost();
            const copy = b.cloneNode(true);
            if (copy.querySelectorAll) copy.querySelectorAll('.ghost').forEach(g => g.remove());
            b.after(copy);
            placeCaretAtEndOf(copy);
            afterBlockEdit();
        }

        function moveBlock(b, dir) {
            const sib = dir < 0 ? b.previousElementSibling : b.nextElementSibling;
            if (!sib) return;                    // already at the edge
            if (dir < 0) sib.before(b); else sib.after(b);
            placeCaretAtEndOf(b);
            afterBlockEdit();
        }

        function deleteBlock(b) {
            removeGhost();
            const parent = b.parentElement;
            b.remove();
            // Removing the last bullet leaves an empty <ul>; drop it too.
            if (parent && (parent.tagName === 'UL' || parent.tagName === 'OL') && parent.children.length === 0) {
                parent.remove();
            }
            editor.focus();
            afterBlockEdit();
        }

        function copyBlock(b) {
            const txt = b.innerText;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(txt).catch(() => legacyCopy(b));
            } else { legacyCopy(b); }
        }
        function legacyCopy(b) { setSelectionToBlock(b); document.execCommand('copy'); }

        // Notion-ish palette; values chosen to stay readable on light and dark themes.
        const TEXT_COLORS = [
            ['Default', ''], ['Gray', '#9b9b9b'], ['Orange', '#d9730d'], ['Yellow', '#cb9d06'],
            ['Green', '#2e9e83'], ['Blue', '#5b8def'], ['Purple', '#9d68e3'], ['Pink', '#d15796'], ['Red', '#e35958']];
        // Background swatches are the text colors at low alpha, so they read on
        // any theme.
        const BG_COLORS = TEXT_COLORS.map(([n, c]) => [n, c === '' ? '' :
            'rgba(' + parseInt(c.slice(1, 3), 16) + ',' + parseInt(c.slice(3, 5), 16) + ',' + parseInt(c.slice(5, 7), 16) + ',0.22)']);
        function setBlockColor(b, c) { b.style.color = c; afterBlockEdit(); }
        function setBlockBg(b, c) {
            b.style.backgroundColor = c;
            b.style.borderRadius = c ? '4px' : '';
            afterBlockEdit();
        }

        // Block-scoped AI: sends the block's text + instruction to C#, which runs
        // it through the same rewrite pipeline as the AI panel. The block pulses
        // until the result replaces it (undoable with a single Ctrl+Z).
        function runBlockAi(b, instruction) {
            instruction = (instruction || '').trim();
            if (!instruction) return;
            removeGhost();               // never send a not-accepted suggestion as the user's text
            const id = ++aiBlockSeq;
            // Failsafe: if the reply is ever lost (the bridge send is best-effort),
            // clear the pending state instead of pulsing forever. 150s exceeds the
            // C# AI HttpClient's 2-minute timeout with slack.
            const timer = setTimeout(() => finishBlockAi(id), 150000);
            pendingAiBlocks[id] = { block: b, timer: timer };
            b.classList.add('ai-busy');
            send({ type: 'blockAi', id: id, epoch: epoch, text: b.innerText, instruction: instruction });
        }
        // Retires a pending block-AI request: clears its failsafe timer and busy
        // state, and returns the target block (null if unknown/already retired).
        function finishBlockAi(id) {
            const p = pendingAiBlocks[id];
            if (!p) return null;
            clearTimeout(p.timer);
            delete pendingAiBlocks[id];
            if (p.block && p.block.classList) p.block.classList.remove('ai-busy');
            return p.block;
        }
        window.applyBlockAi = function (id, html, error) {
            const b = finishBlockAi(id);
            if (!b || !editor.contains(b) || error || !html) return;
            const t = document.createElement('template');
            t.innerHTML = sanitize(html);
            const nodes = [...t.content.childNodes];
            // A reply that sanitizes to nothing must not DELETE the block below.
            if (nodes.length === 0 || (!t.content.textContent.trim() && !t.content.querySelector('table'))) return;
            pushHistory();               // snapshot pre-edit: one undo restores it
            if (b.tagName === 'LI') {
                // Keep list structure: a returned list splices its items in place;
                // anything else becomes the bullet's new inline content.
                if (nodes.length === 1 && (nodes[0].tagName === 'UL' || nodes[0].tagName === 'OL')) {
                    b.replaceWith(...[...nodes[0].children]);
                } else {
                    const tmp = document.createElement('div');
                    nodes.forEach(n => tmp.appendChild(n));
                    b.innerHTML = tmp.innerHTML.replace(/<\/?(p|div)(?=[\s/>])[^>]*>/gi, ' ').trim() || tmp.textContent;
                }
            } else {
                b.replaceWith(...nodes);
            }
            afterBlockEdit();
        };

        // ---- Menu UI ----
        const MENU_ACTIONS = [
            { icon: '⇄', label: 'Turn into', page: 'turninto' },
            { icon: '◐', label: 'Color', page: 'color' },
            { icon: '❏', label: 'Copy block', run: copyBlock },
            { icon: '❐', label: 'Duplicate', kbd: 'Ctrl+D', run: duplicateBlock },
            { icon: '↑', label: 'Move up', kbd: 'Alt+↑', run: b => moveBlock(b, -1) },
            { icon: '↓', label: 'Move down', kbd: 'Alt+↓', run: b => moveBlock(b, 1) },
            { icon: '✕', label: 'Delete', danger: true, run: deleteBlock },
            { icon: '✦', label: 'Ask AI', kbd: 'Ctrl+J', page: 'ai' },
        ];
        const TURN_INTO = [
            { label: 'Text', kind: 'P' }, { label: 'Heading 1', kind: 'H1' },
            { label: 'Heading 2', kind: 'H2' }, { label: 'Heading 3', kind: 'H3' },
            { label: 'Bulleted list', kind: 'UL' }, { label: 'Numbered list', kind: 'OL' },
            { label: 'To-do list', kind: 'TODO' }, { label: 'Toggle list', kind: 'TOGGLE' },
            { label: 'Quote', kind: 'BLOCKQUOTE' }, { label: 'Code', kind: 'PRE' },
            { label: 'Callout', kind: 'CALLOUT' }];

        // One builder for a 'Turn into <kind>' row, shared by the submenu page
        // and the search results so the two can never drift apart.
        function turnIntoItem(t, b) {
            const it = mkItem('⇄', t.label, {});
            it.onmousedown = (e) => { e.preventDefault(); closeMenu(); turnInto(b, t.kind); };
            return it;
        }

        // The block containing the caret, if any (shared by keyboard shortcuts).
        function caretBlock() { return blockOf(window.getSelection().anchorNode); }

        function mkItem(icon, label, extra) {
            const it = document.createElement('div');
            it.className = 'bm-item' + (extra && extra.danger ? ' bm-danger' : '');
            const ic = document.createElement('span'); ic.className = 'bm-icon'; ic.textContent = icon;
            const lb = document.createElement('span'); lb.textContent = label;
            it.append(ic, lb);
            if (extra && extra.kbd) { const k = document.createElement('span'); k.className = 'bm-kbd'; k.textContent = extra.kbd; it.append(k); }
            if (extra && extra.chev) { const c = document.createElement('span'); c.className = 'bm-chev'; c.textContent = '›'; it.append(c); }
            return it;
        }

        function renderMenu(page) {
            menu.innerHTML = '';
            const b = menuBlock;
            if (page === 'root') {
                const search = document.createElement('input');
                search.className = 'bm-input';
                search.placeholder = 'Search actions...';
                menu.append(search);
                const list = document.createElement('div');
                menu.append(list);
                const fill = (filter) => {
                    list.innerHTML = '';
                    const f = (filter || '').toLowerCase();
                    for (const a of MENU_ACTIONS) {
                        if (a.label === 'Turn into' && b.tagName === 'TABLE') continue;
                        if (!f || a.label.toLowerCase().includes(f)) {
                            const it = mkItem(a.icon, a.label, { kbd: a.kbd, danger: a.danger, chev: !!a.page });
                            it.onmousedown = (e) => { e.preventDefault(); a.page ? renderMenu(a.page) : (closeMenu(), a.run(b)); };
                            list.append(it);
                        }
                    }
                    // Searching also surfaces the Turn-into targets directly.
                    if (f && b.tagName !== 'TABLE') {
                        for (const t of TURN_INTO.filter(t => t.label.toLowerCase().includes(f))) {
                            list.append(turnIntoItem(t, b));
                        }
                    }
                };
                fill('');
                search.oninput = () => fill(search.value);
                search.onkeydown = (e) => {
                    if (e.key === 'Escape') { closeMenu(); }
                    if (e.key === 'Enter') {
                        const first = list.querySelector('.bm-item');
                        if (first) first.dispatchEvent(new MouseEvent('mousedown'));
                    }
                    e.stopPropagation();
                };
                setTimeout(() => search.focus(), 0);
            } else if (page === 'turninto') {
                menu.append(backRow());
                for (const t of TURN_INTO) {
                    menu.append(turnIntoItem(t, b));
                }
            } else if (page === 'color') {
                menu.append(backRow());
                const t1 = document.createElement('div'); t1.className = 'bm-title'; t1.textContent = 'TEXT COLOR';
                menu.append(t1, swatches(TEXT_COLORS, c => setBlockColor(b, c), false));
                const t2 = document.createElement('div'); t2.className = 'bm-title'; t2.textContent = 'BACKGROUND';
                menu.append(t2, swatches(BG_COLORS, c => setBlockBg(b, c), true));
            } else if (page === 'ai') {
                menu.append(backRow());
                const input = document.createElement('input');
                input.className = 'bm-input';
                input.placeholder = 'Tell AI what to do with this block...';
                input.onkeydown = (e) => {
                    if (e.key === 'Enter' && input.value.trim()) { const v = input.value; closeMenu(); runBlockAi(b, v); }
                    if (e.key === 'Escape') closeMenu();
                    e.stopPropagation();
                };
                menu.append(input);
                setTimeout(() => input.focus(), 0);
            }
            clampMenu();
        }
        function backRow() {
            const it = mkItem('‹', 'Back', {});
            it.onmousedown = (e) => { e.preventDefault(); renderMenu('root'); };
            return it;
        }
        function swatches(colors, apply, isBg) {
            const grid = document.createElement('div');
            grid.className = 'bm-swatches';
            for (const [name, c] of colors) {
                const s = document.createElement('div');
                s.className = 'bm-swatch';
                s.title = name;
                if (c === '') { s.textContent = '✕'; }
                else if (isBg) { s.style.background = c; }
                else { s.style.color = c; s.textContent = 'A'; }
                s.onmousedown = (e) => { e.preventDefault(); closeMenu(); apply(c); };
                grid.append(s);
            }
            return grid;
        }

        function openMenu(x, y, block, page) {
            if (!block) return;
            menuBlock = block;
            menu.style.display = 'block';
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
            renderMenu(page || 'root');
            handle.style.display = 'none';
        }
        function clampMenu() {
            const r = menu.getBoundingClientRect();
            if (r.right > innerWidth - 8) menu.style.left = Math.max(8, innerWidth - 8 - r.width) + 'px';
            if (r.bottom > innerHeight - 8) menu.style.top = Math.max(8, innerHeight - 8 - r.height) + 'px';
        }
        function closeMenu() {
            menu.style.display = 'none';
            menu.innerHTML = '';
            menuBlock = null;
        }

        // ---- Handle + menu wiring ----
        // rAF-gated: blockAtY measures every block's rect, so running it on raw
        // mousemove (which can fire far faster than the frame rate) would force
        // layout repeatedly per frame on long notes.
        let handleRaf = 0;
        document.addEventListener('mousemove', (e) => {
            if (handleRaf) return;
            const x = e.clientX, y = e.clientY;
            handleRaf = requestAnimationFrame(() => {
                handleRaf = 0;
                updateHandle(x, y);
            });
        });
        function updateHandle(x, y) {
            if (menuOpen() || dragBlock) return;
            const er = editor.getBoundingClientRect();
            if (y < er.top || y > er.bottom || x < er.left - 44 || x > er.right) {
                handle.style.display = 'none'; hoverBlock = null;
                return;
            }
            const b = blockAtY(y);
            if (!b) { handle.style.display = 'none'; hoverBlock = null; return; }
            hoverBlock = b;
            const r = b.getBoundingClientRect();
            handle.style.display = 'flex';
            handle.style.left = Math.max(2, r.left - 26) + 'px';
            handle.style.top = (r.top + 1) + 'px';
        }
        // Press-and-move on the handle drags the block (HTML5 drag-and-drop never
        // fires inside these WebViews, so this is plain mouse tracking); a press
        // released without movement opens the block menu.
        const dropLine = document.getElementById('dropline');
        let armedDrag = null;    // {x, y, block} set on handle mousedown
        let dragBlock = null;    // block being dragged (threshold crossed)
        let dropTarget = null;   // {block, before}

        // The top-level draggable unit (direct child of #editor).
        function topBlockOf(node) {
            let el = node && (node.nodeType === 1 ? node : node.parentElement);
            while (el && el.parentElement !== editor) el = el.parentElement;
            return (el && el !== editor && BLOCK_TAGS.has(el.tagName)) ? el : null;
        }

        handle.addEventListener('mousedown', (e) => {
            e.preventDefault(); // keep the editor's caret/selection intact
            if (hoverBlock) {
                armedDrag = { x: e.clientX, y: e.clientY, block: hoverBlock };
            }
        });
        document.addEventListener('mousemove', (e) => {
            if (!armedDrag) return;
            if (!dragBlock) {
                if (Math.abs(e.clientX - armedDrag.x) + Math.abs(e.clientY - armedDrag.y) < 5) return;
                dragBlock = armedDrag.block;       // threshold crossed: start dragging
                dragBlock.style.opacity = '0.4';
                handle.style.display = 'none';     // don't block elementFromPoint
            }
            const under = document.elementFromPoint(e.clientX, e.clientY);
            // Bullets reorder within their own list; top-level blocks across the note.
            let b = null;
            if (dragBlock.tagName === 'LI') {
                const li = under && (under.nodeType === 1 ? under : under.parentElement)?.closest('li');
                if (li && li.parentElement === dragBlock.parentElement) b = li;
            } else {
                b = topBlockOf(under);
            }
            if (!b || b === dragBlock) { dropLine.style.display = 'none'; dropTarget = null; return; }
            const r = b.getBoundingClientRect();
            const before = e.clientY < r.top + r.height / 2;
            dropTarget = { block: b, before };
            dropLine.style.left = r.left + 'px';
            dropLine.style.width = r.width + 'px';
            dropLine.style.top = (before ? r.top - 2 : r.bottom) + 'px';
            dropLine.style.display = 'block';
        });
        document.addEventListener('mouseup', () => {
            if (!armedDrag) return;
            if (dragBlock) {
                if (dropTarget) {
                    if (dropTarget.before) { dropTarget.block.before(dragBlock); }
                    else { dropTarget.block.after(dragBlock); }
                    afterBlockEdit();
                }
                dragBlock.style.opacity = '';
            } else {
                // No movement: it was a click - open the block menu.
                const r = handle.getBoundingClientRect();
                openMenu(r.left, r.bottom + 4, armedDrag.block);
            }
            armedDrag = null;
            dragBlock = null;
            dropTarget = null;
            dropLine.style.display = 'none';
        });
        editor.addEventListener('contextmenu', (e) => {
            let b = blockOf(e.target) || blockAtY(e.clientY);
            // Bare text at the editor root isn't a block yet; wrap it into real
            // blocks once (explicit user intent, so rewriting the DOM is safe),
            // then look again.
            if (!b && normalizeEditorBlocks()) {
                b = blockOf(e.target) || blockAtY(e.clientY);
            }
            if (!b) return;              // empty note: keep the native menu
            e.preventDefault();
            openMenu(e.clientX, e.clientY, b);
        });
        // Menu-internal clicks must never reach the outside-click closer below:
        // submenu navigation re-renders the menu, detaching the clicked row, so
        // by the time the event bubbles to document, contains() would be false
        // and the menu would close instead of navigating.
        menu.addEventListener('mousedown', (e) => e.stopPropagation());
        document.addEventListener('mousedown', (e) => {
            if (menuOpen() && !menu.contains(e.target) && e.target !== handle) closeMenu();
            if (slashActive && !slashMenu.contains(e.target)) closeSlash();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menuOpen()) closeMenu();
        });
        window.addEventListener('scroll', () => {
            closeMenu();
            closeSlash();
            handle.style.display = 'none';
            selBar.style.display = 'none';
            selPalette.style.display = 'none';
        }, true);

        // ---- Enter-key behavior inside rich blocks ----
        // WebKit's default Enter clones whole blocks (duplicating checkboxes and
        // callout icons), so the common cases are handled explicitly here.
        function closestIn(node, selector) {
            const el = node && (node.nodeType === 1 ? node : node.parentElement);
            const hit = el ? el.closest(selector) : null;
            return hit && editor.contains(hit) ? hit : null;
        }
        function placeCaretIn(el, atEnd) {
            const r = document.createRange();
            r.selectNodeContents(el);
            r.collapse(!atEnd);
            const s = window.getSelection();
            s.removeAllRanges();
            s.addRange(r);
        }
        function isBlankText(t) { return !(t || '').replace(/ /g, ' ').trim(); }

        function handleEnterInBlocks(e) {
            const sel = window.getSelection();
            if (!sel.rangeCount || !sel.isCollapsed) return false;
            const n = sel.anchorNode;

            const todo = closestIn(n, '.todo');
            if (todo) {
                e.preventDefault();
                const span = todo.querySelector('span');
                if (span && isBlankText(span.textContent)) {
                    // Enter on an empty to-do exits the list into a paragraph.
                    const p = document.createElement('p');
                    p.innerHTML = '<br>';
                    todo.replaceWith(p);
                    placeCaretIn(p, false);
                } else {
                    // Continue the list with a fresh unchecked item.
                    const fresh = document.createElement('div');
                    fresh.className = 'todo';
                    fresh.innerHTML = '<input type="checkbox" contenteditable="false"><span> </span>';
                    todo.after(fresh);
                    placeCaretIn(fresh.querySelector('span'), false);
                }
                notifyChanged();
                return true;
            }

            const summary = closestIn(n, 'summary');
            if (summary) {
                // Enter on the toggle header moves into (and opens) its body.
                e.preventDefault();
                const details = summary.parentElement;
                let body = details.querySelector(':scope > div');
                if (!body) {
                    body = document.createElement('div');
                    body.innerHTML = '<br>';
                    details.appendChild(body);
                }
                details.setAttribute('open', '');
                placeCaretIn(body, false);
                notifyChanged();
                return true;
            }

            const calloutBody = closestIn(n, '.callout-body');
            if (calloutBody) {
                // Enter on an empty last line exits below the callout;
                // otherwise the default split stays inside the body, which is fine.
                const line = closestIn(n, '.callout-body > div');
                if (line && line === calloutBody.lastElementChild && isBlankText(line.textContent)) {
                    e.preventDefault();
                    const p = document.createElement('p');
                    p.innerHTML = '<br>';
                    calloutBody.closest('.callout').after(p);
                    line.remove();
                    placeCaretIn(p, false);
                    notifyChanged();
                    return true;
                }
            }

            return false;
        }

        // ---- Interactive blocks (checkboxes, toggles) ----
        editor.addEventListener('click', (e) => {
            const box = e.target.closest('input[type="checkbox"]');
            if (box) {
                // Mirror the live state into the attribute so it survives
                // innerHTML serialization (save/sync/undo).
                if (box.checked) { box.setAttribute('checked', ''); } else { box.removeAttribute('checked'); }
                const todo = box.closest('.todo');
                if (todo) { todo.classList.toggle('done', box.checked); }
                notifyChanged();
                return;
            }
            const summary = e.target.closest('summary');
            if (summary && e.offsetX < 20) {
                // Click on the ▸ marker toggles; clicks on the text edit it.
                const details = summary.parentElement;
                if (details.hasAttribute('open')) { details.removeAttribute('open'); }
                else { details.setAttribute('open', ''); }
                e.preventDefault();
                notifyChanged();
            }
        });

        // ---- Events ----
        editor.addEventListener('keydown', (e) => {
            // Slash-menu navigation takes priority while the menu is open.
            if (slashActive) {
                if (e.key === 'ArrowDown') { e.preventDefault(); slashIndex = Math.min(slashIndex + 1, slashFiltered.length - 1); renderSlash(slashQuery()); return; }
                if (e.key === 'ArrowUp') { e.preventDefault(); slashIndex = Math.max(slashIndex - 1, 0); renderSlash(slashQuery()); return; }
                if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); if (slashFiltered[slashIndex]) applySlash(slashFiltered[slashIndex]); return; }
                if (e.key === 'Escape' || e.key === 'ArrowLeft') { closeSlash(); return; }
            }

            if (e.key === 'Enter' && !e.shiftKey && handleEnterInBlocks(e)) {
                return;
            }

            // Standard editing shortcuts (Cmd on macOS, Ctrl on Windows).
            const mod = e.metaKey || e.ctrlKey;
            if (mod && !e.altKey) {
                const k = e.key.toLowerCase();
                if (k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
                if (k === 'y') { e.preventDefault(); redo(); return; }
                if (k === 'b') { e.preventDefault(); fmt('bold'); return; }
                if (k === 'i') { e.preventDefault(); fmt('italic'); return; }
                if (k === 'u') { e.preventDefault(); fmt('underline'); return; }
                // Block shortcuts (match the labels in the block menu).
                if (k === 'd') {
                    e.preventDefault();
                    const b = caretBlock();
                    if (b) duplicateBlock(b);
                    return;
                }
                if (k === 'j') {
                    e.preventDefault();
                    const b = caretBlock();
                    if (b) { const r = b.getBoundingClientRect(); openMenu(r.left, r.bottom + 4, b, 'ai'); }
                    return;
                }
                // Everything else (Cmd+A/C/V/X...) keeps its native behavior.
            }
            // Alt+↑ / Alt+↓ move the current block, like the menu's Move up/down.
            if (e.altKey && !mod && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
                const b = caretBlock();
                if (b) { e.preventDefault(); moveBlock(b, e.key === 'ArrowUp' ? -1 : 1); return; }
            }
            if (e.key === 'Tab') {
                // Always handle Tab ourselves so it never moves focus / jumps the caret.
                e.preventDefault();
                if (ghostEl) { acceptGhost(); }
                else { document.execCommand('insertText', false, '    '); }
                return;
            }
            // Any real edit/navigation key dismisses a stale suggestion.
            if (ghostEl && !['Shift', 'Control', 'Meta', 'Alt'].includes(e.key)) {
                removeGhost();
            }
        });
        editor.addEventListener('input', () => { removeGhost(); notifyChanged(); scheduleCompletion(); checkSlashTrigger(); });
        editor.addEventListener('blur', () => { removeGhost(); notifyChanged(); });

        // Tell C# (on its next drain poll) that the editor is ready for content.
        function signalReady() { send({ type: 'ready' }); }
        if (document.readyState === 'complete') {
            signalReady();
        } else {
            window.addEventListener('load', signalReady);
        }
    </script>
</body>
</html>
