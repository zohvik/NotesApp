name: Windows Build

# The MAUI Windows target can only be compiled on Windows. This runs on a
# GitHub-hosted Windows runner so we get a real Windows build (and a
# downloadable .exe) without needing a Windows machine locally.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:      # lets us trigger it by hand from the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the MAUI workload
        run: dotnet workload restore src/NotesApp.Client/NotesApp.Client.csproj

      - name: Build the Windows client
        run: dotnet build src/NotesApp.Client/NotesApp.Client.csproj -c Release -f net10.0-windows10.0.19041.0

      - name: Upload the built app
        uses: actions/upload-artifact@v4
        with:
          name: notesapp-windows
          path: src/NotesApp.Client/bin/Release/net10.0-windows10.0.19041.0/
          if-no-files-found: error
